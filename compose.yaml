services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: pg_expenses
      DB_USER: pgapp
      DB_PASSWORD: ${DB_PASSWORD:-pgapp_local}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/var/www/html/uploads

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pg_expenses
      MARIADB_USER: pgapp
      MARIADB_PASSWORD: ${DB_PASSWORD:-pgapp_local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    ports:
      - "3309:3306"
    volumes:
      - pg_expenses_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-charukesh}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-VivaGrafana2026!}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pg_expenses_data:
  prometheus_data:
  grafana_data:


